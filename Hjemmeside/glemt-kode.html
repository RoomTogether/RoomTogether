<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glemt kodeord — RoomTogether</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main class="auth-shell wrap">
    <div class="panel auth-card">
      <p class="eyebrow">Nulstil kodeord</p>
      <h1 style="font-family:var(--display);font-size:2rem;margin:.3rem 0 1rem">Glemt kodeord</h1>
      <div id="request">
        <p style="margin-bottom:1rem;opacity:.75">Indtast din e-mail. Du får et link til at vælge nyt kodeord.</p>
        <form class="form" id="form-request">
          <div class="field"><label>E-mail</label><input name="email" type="email" required placeholder="dig@mail.dk"></div>
          <button class="btn btn-primary" type="submit">Send nulstillingslink</button>
        </form>
      </div>
      <div id="reset" hidden>
        <p style="margin-bottom:1rem;opacity:.75">Vælg dit nye kodeord.</p>
        <form class="form" id="form-reset">
          <div class="field"><label>Nyt kodeord</label><input name="password" type="password" minlength="6" required></div>
          <div class="field"><label>Gentag kodeord</label><input name="password2" type="password" minlength="6" required></div>
          <button class="btn btn-primary" type="submit">Gem nyt kodeord</button>
        </form>
      </div>
      <p style="margin-top:1rem;opacity:.75"><a href="login.html" style="text-decoration:underline">Tilbage til log ind</a></p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    boot('login.html', () => {
      const showReset = qs('reset') === '1' || qs('invite') === '1' || location.hash.includes('recovery') || location.hash.includes('invite')
      if (showReset) {
        document.getElementById('request').hidden = true
        document.getElementById('reset').hidden = false
      }
      document.getElementById('form-request').onsubmit = async e => {
        e.preventDefault()
        const NI = await loadIdentity()
        if (!NI) return toast('Identity er ikke tilgængelig her — deploy til Netlify')
        try {
          await NI.requestPasswordRecovery(e.target.email.value.trim().toLowerCase())
          toast('Tjek din e-mail for linket')
        } catch (err) {
          toast((err && err.message) || 'Kunne ikke sende mail')
        }
      }
      document.getElementById('form-reset').onsubmit = async e => {
        e.preventDefault()
        const f = e.target
        if (f.password.value !== f.password2.value) return toast('Kodeordene er ikke ens')
        const NI = await loadIdentity()
        if (!NI) return toast('Identity er ikke tilgængelig her — deploy til Netlify')
        try {
          if (qs('invite') === '1') {
            const token = new URLSearchParams(location.hash.replace(/^#/, '')).get('invite_token') || qs('token')
            if (token && NI.acceptInvite) await NI.acceptInvite(token, f.password.value)
            else await NI.updateUser({ password: f.password.value })
          } else {
            await NI.updateUser({ password: f.password.value })
          }
          toast('Kodeord opdateret')
          location.href = 'login.html'
        } catch (err) {
          toast((err && err.message) || 'Kunne ikke opdatere kodeord')
        }
      }
    })
  </script>
</body>
</html>
