<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log ind — RoomTogether</title>
  <meta name="description" content="Log ind på RoomTogether for at se match, beskeder og dine opslag.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://roomtogether.dk/login.html">
  <link rel="icon" href="Logo/roomtogether-logo.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main class="auth-shell wrap">
    <div class="panel auth-card">
      <p class="eyebrow">Velkommen tilbage</p>
      <h1 style="font-family:var(--display);font-size:2rem;margin:.3rem 0 1rem">Log ind</h1>
      <form class="form" id="form">
        <div class="field"><label>E-mail</label><input name="email" type="email" required placeholder="dig@mail.dk"></div>
        <div class="field"><label>Kodeord</label><input name="password" type="password" required></div>
        <p style="margin:-.2rem 0 .6rem;text-align:right"><a href="glemt-kode.html" style="font-size:.9rem;text-decoration:underline;opacity:.75">Glemt kodeord?</a></p>
        <button class="btn btn-primary" type="submit">Log ind</button>
      </form>
      <p style="margin-top:1rem;opacity:.75">Ingen konto? <a href="opret.html" style="text-decoration:underline">Opret profil</a></p>
      <p style="margin-top:.8rem;font-size:.85rem;opacity:.6">Login via Netlify Identity. Test på din Netlify-URL (virker ikke i lokal `netlify dev`).</p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script>
    boot('login.html', () => {
      const me = sessionUser()
      if (me) location.href = qs('next') || homeFor(me)
      document.getElementById('form').onsubmit = async e => {
        e.preventDefault()
        const f = e.target
        const NI = await loadIdentity()
        if (!NI) return toast('Identity er ikke tilgængelig her — deploy til Netlify')
        try {
          const iu = await NI.login(f.email.value.trim().toLowerCase(), f.password.value)
          const user = ensureLocalUser(iu)
          toast('Velkommen ' + user.name)
          location.href = qs('next') || homeFor(user)
        } catch (err) {
          toast(err && err.status === 401 ? 'Forkert e-mail eller kode' : (err && err.message) || 'Login fejlede')
        }
      }
    })
  </script>
</body>
</html>
